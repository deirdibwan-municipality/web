<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الحملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081C18;
    --panel:#0E2621;
    --panel-2:#0B1F1B;
    --gold:#D4A24C;
    --gold-2:#F0C878;
    --text:#F5F1E6;
    --muted:#84A79A;
    --rule:rgba(245,241,230,0.10);
    --danger:#D9705A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:28px 18px 60px;}
  h1{
    font-family:'Lalezar','Cairo',sans-serif;
    font-size:32px;
    margin:0 0 4px;
    color:var(--gold-2);
  }
  .sub{color:var(--muted); font-size:14px; margin-bottom:20px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
  }
  .panel h3{margin:0 0 14px; font-size:14.5px; color:var(--muted); font-weight:700;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:6px; flex:1 1 150px;}
  .field label{font-size:12.5px; color:var(--muted); font-weight:600;}
  .field input{
    background:var(--panel-2);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-size:15px;
    outline:none;
    font-family:inherit;
  }
  .field input:focus{border-color:var(--gold);}
  .btn{
    background:var(--gold);
    color:#1a1206;
    font-weight:800;
    font-size:15px;
    padding:12px 20px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--rule); font-weight:700;}
  .stat{font-size:13.5px; color:var(--muted); margin-top:10px;}
  .stat b{color:var(--gold-2);}
  .log{margin-top:6px; display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto;}
  .log-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; background:var(--panel-2);
    border-radius:10px; border:1px solid var(--rule);
    font-size:14px;
  }
  .log-row .n{flex:1 1 auto; font-weight:700;}
  .log-row .a{color:var(--gold-2); font-weight:800;}
  .toast{
    position:fixed; bottom:20px; right:20px; left:20px; max-width:360px; margin:0 auto;
    background:var(--panel); border:1px solid var(--gold); color:var(--text);
    padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; text-align:center;
    opacity:0; transform:translateY(10px); transition:opacity 220ms, transform 220ms; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة تحكم الحملة</h1>
  <div class="sub">هاي الصفحة خاصة فيك بس — لا تشاركها مع أحد، لأن أي حدا يفتحها بيقدر يضيف تبرعات.</div>

  <div class="panel">
    <h3>هدف الحملة</h3>
    <div class="row">
      <div class="field" style="flex:2 1 200px;">
        <label>المبلغ المستهدف (دولار)</label>
        <input type="number" id="goalInput" min="0" step="1" placeholder="200000">
      </div>
      <div class="field" style="flex:0 0 auto; justify-content:flex-end;">
        <label>&nbsp;</label>
        <button class="btn secondary" id="setGoalBtn">تحديث الهدف</button>
      </div>
    </div>
    <div class="stat">تم جمع <b id="totalNow">$0</b> من أصل <b id="goalNow">$0</b></div>
  </div>

  <div class="panel">
    <h3>إضافة تبرع جديد</h3>
    <div class="row">
      <div class="field">
        <label>اسم المتبرع</label>
        <input type="text" id="nameInput" placeholder="أبو أحمد">
      </div>
      <div class="field">
        <label>المبلغ (دولار)</label>
        <input type="number" id="amountInput" min="0" step="1" placeholder="100">
      </div>
      <div class="field" style="flex:0 0 auto; justify-content:flex-end;">
        <label>&nbsp;</label>
        <button class="btn" id="addBtn">إضافة</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>آخر التبرعات المسجّلة</h3>
    <div class="log" id="logList"><div class="stat">جاري التحميل…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
  function fmt(n){ n = Number(n)||0; return '$' + n.toLocaleString('en-US',{maximumFractionDigits:0}); }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  async function refresh(){
    try{
      const res = await fetch(APPS_SCRIPT_URL + '?action=data&t=' + Date.now());
      const data = await res.json();
      document.getElementById('totalNow').textContent = fmt(data.total);
      document.getElementById('goalNow').textContent = fmt(data.goal);
      const gi = document.getElementById('goalInput');
      if (document.activeElement !== gi) gi.value = data.goal || '';

      const log = document.getElementById('logList');
      const recent = (data.recent || []).slice(0, 15);
      if (recent.length === 0){
        log.innerHTML = '<div class="stat">لا توجد تبرعات بعد.</div>';
      } else {
        log.innerHTML = '';
        recent.forEach(d=>{
          const row = document.createElement('div');
          row.className = 'log-row';
          row.innerHTML = '<div class="n"></div><div class="a"></div>';
          row.querySelector('.n').textContent = d.name;
          row.querySelector('.a').textContent = fmt(d.amount);
          log.appendChild(row);
        });
      }
    }catch(e){
      showToast('تعذّر الاتصال بجوجل شيت — تأكد من الرابط بـ config.js');
    }
  }

  async function addDonation(){
    const nameInput = document.getElementById('nameInput');
    const amountInput = document.getElementById('amountInput');
    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);
    if (!name){ showToast('اكتب اسم المتبرع'); nameInput.focus(); return; }
    if (!amount || amount<=0){ showToast('اكتب مبلغ صحيح'); amountInput.focus(); return; }
    try{
      const url = APPS_SCRIPT_URL + '?action=add&secret=' + encodeURIComponent(ADMIN_SECRET)
        + '&name=' + encodeURIComponent(name) + '&amount=' + encodeURIComponent(amount);
      const res = await fetch(url);
      const out = await res.json();
      if (out.ok){
        nameInput.value=''; amountInput.value='';
        nameInput.focus();
        showToast('تمت إضافة التبرع ✓');
        refresh();
      } else {
        showToast('صار خطأ: ' + (out.error || 'غير معروف'));
      }
    }catch(e){
      showToast('تعذّر الإرسال، حاول مرة ثانية');
    }
  }

  async function setGoal(){
    const val = Number(document.getElementById('goalInput').value);
    if (!val || val<=0){ showToast('اكتب مبلغ هدف صحيح'); return; }
    try{
      const url = APPS_SCRIPT_URL + '?action=setgoal&secret=' + encodeURIComponent(ADMIN_SECRET) + '&goal=' + encodeURIComponent(val);
      const res = await fetch(url);
      const out = await res.json();
      if (out.ok){ showToast('تم تحديث الهدف ✓'); refresh(); }
      else { showToast('صار خطأ: ' + (out.error || 'غير معروف')); }
    }catch(e){
      showToast('تعذّر الإرسال، حاول مرة ثانية');
    }
  }

  document.getElementById('addBtn').addEventListener('click', addDonation);
  document.getElementById('setGoalBtn').addEventListener('click', setGoal);
  [document.getElementById('nameInput'), document.getElementById('amountInput')].forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') addDonation(); });
  });
  document.getElementById('goalInput').addEventListener('keydown', e=>{ if(e.key==='Enter') setGoal(); });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
