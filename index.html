<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الحملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081C18;
    --panel:rgba(14,38,33,0.78);
    --gold:#D4A24C;
    --gold-2:#F0C878;
    --text:#F5F1E6;
    --muted:#84A79A;
    --rule:rgba(245,241,230,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,162,76,0.16), transparent 60%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .stage{
    width:100%;
    max-width:600px;
    text-align:center;
  }
  .campaign-title{
    font-size:16px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:6px;
  }
  .goal-label{
    font-size:14px;
    color:var(--muted);
    font-weight:600;
  }
  .goal-amount{
    font-size:20px;
    color:var(--gold-2);
    font-weight:800;
    margin-top:2px;
  }
  .remaining-label{
    font-size:16px;
    color:var(--gold-2);
    font-weight:700;
    margin-top:26px;
  }
  .remaining-amount{
    font-family:'Lalezar', 'Cairo', sans-serif;
    font-size:clamp(60px, 13vw, 120px);
    line-height:1;
    color:var(--text);
    margin-top:6px;
    text-shadow: 0 0 40px rgba(212,162,76,0.25);
  }
  .goal-reached{
    font-family:'Lalezar', 'Cairo', sans-serif;
    font-size:clamp(30px,6vw,44px);
    color:var(--gold-2);
    margin-top:26px;
  }

  .latest{
    margin-top:38px;
    padding:18px 22px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:18px;
    backdrop-filter: blur(6px);
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .latest-body{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:22px;
    animation: pop 420ms ease-out;
  }
  .latest-body .who{font-weight:800;}
  .latest-body .verb{color:var(--muted); font-size:16px; font-weight:600;}
  .latest-body .amt{color:var(--gold-2); font-weight:900; font-size:26px;}
  @keyframes pop{
    from{opacity:0; transform:scale(0.92);}
    to{opacity:1; transform:scale(1);}
  }
  .empty{color:var(--muted); font-size:14px;}
</style>
</head>
<body>

<div class="stage">
  <div class="campaign-title" id="campaignTitle">حملة تبرعات</div>

  <div class="goal-label">الهدف</div>
  <div class="goal-amount" id="goalAmount">$0</div>

  <div id="progressBlock">
    <div class="remaining-label">متبقي للوصول للهدف</div>
    <div class="remaining-amount" id="remainingAmount">$0</div>
  </div>
  <div id="reachedBlock" class="goal-reached" style="display:none;">🎉 تم الوصول للهدف! شكراً لكل من ساهم</div>

  <div class="latest" id="latestBox">
    <span class="empty" id="latestEmpty">بانتظار أول تبرع…</span>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  document.getElementById('campaignTitle').textContent = CAMPAIGN_TITLE;

  function fmt(n){
    n = Number(n) || 0;
    return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
  }

  let lastKey = null;

  async function poll(){
    try{
      const res = await fetch(APPS_SCRIPT_URL + '?action=data&t=' + Date.now());
      const data = await res.json();
      render(data);
    }catch(e){
      // silent fail, retry next tick
    }
  }

  function render(data){
    const goal = Number(data.goal) || 0;
    const total = Number(data.total) || 0;
    const remaining = Math.max(0, goal - total);

    document.getElementById('goalAmount').textContent = fmt(goal);
    document.getElementById('remainingAmount').textContent = fmt(remaining);

    if (goal > 0 && total >= goal){
      document.getElementById('progressBlock').style.display = 'none';
      document.getElementById('reachedBlock').style.display = 'block';
    } else {
      document.getElementById('progressBlock').style.display = 'block';
      document.getElementById('reachedBlock').style.display = 'none';
    }

    const recent = Array.isArray(data.recent) ? data.recent : [];
    const latest = recent[0];
    const box = document.getElementById('latestBox');
    if (!latest){
      box.innerHTML = '<span class="empty">بانتظار أول تبرع…</span>';
      return;
    }
    const key = latest.name + '|' + latest.amount + '|' + latest.ts;
    if (key !== lastKey){
      lastKey = key;
      box.innerHTML =
        '<div class="latest-body">' +
          '<span class="who"></span>' +
          '<span class="verb">تبرع بـ</span>' +
          '<span class="amt"></span>' +
        '</div>';
      box.querySelector('.who').textContent = latest.name || 'بدون اسم';
      box.querySelector('.amt').textContent = fmt(latest.amount);
    }
  }

  poll();
  setInterval(poll, 4000); // يتحدث كل ٤ ثواني — يناسب البث المباشر
})();
</script>

</body>
</html>
