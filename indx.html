<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الحملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081C18;
    --panel:rgba(14,38,33,0.78);
    --panel-solid:#0E2621;
    --gold:#D4A24C;
    --gold-2:#F0C878;
    --text:#F5F1E6;
    --muted:#84A79A;
    --rule:rgba(245,241,230,0.10);
  } 
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,162,76,0.16), transparent 60%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .stage{
    width:100%;
    max-width:640px;
    text-align:center;
  }
  .campaign-title{
    font-size:15px;
    color:var(--muted);
    font-weight:700;
    letter-spacing:0.3px;
    margin-bottom:2px;
  }
  .remaining-label{
    font-size:15px;
    color:var(--gold-2);
    font-weight:700;
    margin-top:18px;
  }
  .remaining-amount{
    font-family:'Lalezar', 'Cairo', sans-serif;
    font-size:clamp(56px, 12vw, 110px);
    line-height:1;
    color:var(--text);
    margin-top:4px;
    text-shadow: 0 0 40px rgba(212,162,76,0.25);
  }
  .stats-row{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-top:14px;
    font-size:15px;
    color:var(--muted);
    font-weight:600;
    flex-wrap:wrap;
  }
  .stats-row b{
    color:var(--gold-2);
    font-weight:800;
  }

  .bar-outer{
    position:relative;
    height:22px;
    background:rgba(255,255,255,0.06);
    border-radius:100px;
    margin-top:20px;
    overflow:hidden;
    border:1px solid var(--rule);
  }
  .bar-inner{
    position:absolute;
    inset:0;
    width:0%;
    background:linear-gradient(90deg, #B77F33, var(--gold-2));
    border-radius:100px;
    transition:width 900ms cubic-bezier(.2,.8,.2,1);
  }
  .bar-pct{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    font-weight:700;
  }

  .feed{
    margin-top:30px;
    text-align:right;
  }
  .feed h2, .board h2{
    font-size:14px;
    color:var(--muted);
    font-weight:700;
    margin:0 0 10px;
  }
  .feed ul, .board ol{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .feed li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:12px;
    font-size:14.5px;
    backdrop-filter: blur(6px);
    animation: rise 420ms ease-out;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .feed li .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold-2);
    flex:0 0 auto;
  }
  .feed li .who{font-weight:700; flex:1 1 auto;}
  .feed li .amt{color:var(--gold-2); font-weight:800;}

  .board{
    margin-top:26px;
    text-align:right;
  }
  .board li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:12px;
    backdrop-filter: blur(6px);
  }
  .rank{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:13px;
    background:rgba(255,255,255,0.06);
    color:var(--gold-2);
  }
  .board li:first-child .rank{background:var(--gold); color:#1a1206;}
  .board .name{flex:1 1 auto; font-weight:700; font-size:14.5px;}
  .board .amt{color:var(--gold-2); font-weight:800; font-size:14.5px;}

  .empty{
    color:var(--muted);
    font-size:13.5px;
    text-align:center;
    padding:10px 0;
  }
  .goal-reached{
    margin-top:18px;
    font-family:'Lalezar', 'Cairo', sans-serif;
    font-size:clamp(26px,5vw,38px);
    color:var(--gold-2);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="campaign-title" id="campaignTitle">حملة تبرعات</div>

  <div id="progressBlock">
    <div class="remaining-label">متبقي للوصول للهدف</div>
    <div class="remaining-amount" id="remainingAmount">$0</div>

    <div class="stats-row">
      <span>تم جمع <b id="totalRaised">$0</b></span>
      <span>الهدف <b id="goalAmount">$0</b></span>
    </div>

    <div class="bar-outer"><div class="bar-inner" id="barInner"></div></div>
    <div class="bar-pct" id="barPct">0٪</div>
  </div>

  <div id="reachedBlock" class="goal-reached" style="display:none;">🎉 تم الوصول للهدف! شكراً لكل من ساهم</div>

  <div class="feed">
    <h2>آخر التبرعات</h2>
    <ul id="feedList"></ul>
    <div class="empty" id="feedEmpty" style="display:none;">بانتظار أول تبرع…</div>
  </div>

  <div class="board">
    <h2>الأكثر تبرعاً</h2>
    <ol id="topList"></ol>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  document.getElementById('campaignTitle').textContent = CAMPAIGN_TITLE;

  function fmt(n){
    n = Number(n) || 0;
    return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
  }

  let lastSeenCount = 0;
  let firstLoad = true;

  async function poll(){
    try{
      const res = await fetch(APPS_SCRIPT_URL + '?action=data&t=' + Date.now());
      const data = await res.json();
      render(data);
    }catch(e){
      // silent fail, just try again next tick
    }
  }

  function render(data){
    const goal = Number(data.goal) || 0;
    const total = Number(data.total) || 0;
    const remaining = Math.max(0, goal - total);
    const pct = goal > 0 ? Math.min(100, (total/goal)*100) : 0;

    document.getElementById('remainingAmount').textContent = fmt(remaining);
    document.getElementById('totalRaised').textContent = fmt(total);
    document.getElementById('goalAmount').textContent = fmt(goal);
    document.getElementById('barInner').style.width = pct + '%';
    document.getElementById('barPct').textContent = Math.round(pct) + '٪';

    if (goal > 0 && total >= goal){
      document.getElementById('progressBlock').style.display = 'none';
      document.getElementById('reachedBlock').style.display = 'block';
    } else {
      document.getElementById('progressBlock').style.display = 'block';
      document.getElementById('reachedBlock').style.display = 'none';
    }

    // recent feed
    const feedList = document.getElementById('feedList');
    const feedEmpty = document.getElementById('feedEmpty');
    const recent = Array.isArray(data.recent) ? data.recent : [];
    if (recent.length === 0){
      feedEmpty.style.display = 'block';
      feedList.innerHTML = '';
    } else {
      feedEmpty.style.display = 'none';
      feedList.innerHTML = '';
      recent.forEach(d=>{
        const li = document.createElement('li');
        li.innerHTML = '<span class="dot"></span><span class="who"></span><span class="amt"></span>';
        li.querySelector('.who').textContent = (d.name || 'بدون اسم') + ' تبرع بـ';
        li.querySelector('.amt').textContent = fmt(d.amount);
        feedList.appendChild(li);
      });
    }

    // top 5
    const topList = document.getElementById('topList');
    topList.innerHTML = '';
    const top = Array.isArray(data.top) ? data.top : [];
    top.forEach((d,i)=>{
      const li = document.createElement('li');
      li.innerHTML = '<span class="rank"></span><span class="name"></span><span class="amt"></span>';
      li.querySelector('.rank').textContent = i+1;
      li.querySelector('.name').textContent = d.name;
      li.querySelector('.amt').textContent = fmt(d.amount);
      topList.appendChild(li);
    });

    firstLoad = false;
  }

  poll();
  setInterval(poll, 4000); // يتحدث كل ٤ ثواني — يناسب البث المباشر
})();
</script>

</body>
</html>
